[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rotating-shield-simulation-runtime"
version = "0.1.0"
description = "Shared high-fidelity simulation and observation runtime for rotating-shield estimators"
readme = "README.md"
authors = [{ name = "Eiji Morita" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "scipy>=1.16.3",
]

[project.optional-dependencies]
test = ["pytest>=9.0.1"]

[project.scripts]
rotating-shield-sim = "runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["runtime_defaults"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
