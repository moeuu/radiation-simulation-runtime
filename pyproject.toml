[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rotating-shield-simulation-runtime"
version = "0.1.0"
description = "Shared high-fidelity simulation and observation runtime for rotating-shield estimators"
readme = "README.md"
authors = [{ name = "Eiji Morita" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "scipy>=1.16.3",
    "torch>=2.13.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0.1"]

[project.scripts]
rotating-shield-sim = "runtime.cli:main"

[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/*.py[cod]", "**/*.egg-info/**"]

[tool.hatch.build.targets.wheel]
only-include = [
    "src/measurement",
    "src/runtime",
    "src/sim",
    "src/spectrum",
    "src/runtime_environment.py",
]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "native",
    "configs",
    "source_layouts",
    "obstacle_layouts",
    "scripts",
    "tests",
    "docs",
    "AGENTS.md",
    "CITATION.cff",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "uv.lock",
    ".gitignore",
    ".python-version",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
